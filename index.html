<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Life Idle</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #87d0ff 0%, #d7f2ff 35%, #f1ffe4 100%);
        color: #2b2b2b;
      }

      .app {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 32px;
        display: grid;
        gap: 18px;
      }

      .card {
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #d9e6c8;
        box-shadow: 0 10px 30px rgba(44, 82, 36, 0.08);
        padding: 16px;
      }

      h1 {
        margin: 0;
      }

      .hud {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }

      .stat-label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        color: #557451;
      }

      .stat-value {
        margin-top: 4px;
        font-size: 24px;
        font-weight: 800;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      button,
      select {
        border: 1px solid #b5c9a9;
        border-radius: 10px;
        background: #ffffff;
        padding: 9px 12px;
        font-weight: 600;
        color: #23421d;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      #farmGrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(86px, 1fr));
        gap: 10px;
      }

      .tile {
        aspect-ratio: 1 / 1;
        border: 2px solid #b58f63;
        border-radius: 12px;
        background: linear-gradient(180deg, #93653e 0%, #7e5533 100%);
        color: #f8f1e7;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        text-align: center;
        padding: 4px;
      }

      .tile.growing {
        background: linear-gradient(180deg, #6d4c2f 0%, #5f4128 100%);
      }

      .tile.ready {
        background: linear-gradient(180deg, #856400 0%, #6f5300 100%);
        box-shadow: 0 0 0 3px rgba(255, 228, 111, 0.35) inset;
      }

      .emoji {
        font-size: 22px;
      }

      #log {
        margin: 0;
        min-height: 20px;
        color: #3d6032;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>🌾 Farm Life Idle</h1>
        <p>Plant wheat, wait for it to grow through 4 stages, then harvest for coins and XP.</p>
      </section>

      <section class="card hud">
        <div>
          <div class="stat-label">Coins</div>
          <div id="coins" class="stat-value">0</div>
        </div>
        <div>
          <div class="stat-label">Level</div>
          <div id="level" class="stat-value">1</div>
        </div>
        <div>
          <div class="stat-label">XP</div>
          <div id="xp" class="stat-value">0 / 50</div>
        </div>
        <div>
          <div class="stat-label">Wheat Seeds</div>
          <div id="seeds" class="stat-value">5</div>
        </div>
      </section>

      <section class="card controls">
        <button id="buySeedBtn">Buy Wheat Seed (2 coins)</button>
        <button id="upgradeBtn">Growth Speed Upgrade (30 coins)</button>
        <span id="upgradeLabel">Upgrade Level: 0</span>
      </section>

      <section class="card">
        <div id="farmGrid" aria-label="Farm grid"></div>
      </section>

      <section class="card">
        <p id="log">Click an empty tile to plant wheat.</p>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
