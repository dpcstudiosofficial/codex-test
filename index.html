<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Slipstream</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #05070d;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      canvas {
        display: block;
      }

      #hud {
        pointer-events: none;
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px;
        box-sizing: border-box;
      }

      .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .panel {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(8, 12, 24, 0.58);
        padding: 10px 14px;
        backdrop-filter: blur(6px);
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }

      .label {
        font-size: 11px;
        opacity: 0.75;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .value {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.1;
      }

      #speedometer {
        width: 180px;
        height: 180px;
      }

      #message {
        align-self: center;
        margin-bottom: 8vh;
        text-align: center;
        font-size: 18px;
        line-height: 1.5;
        padding: 12px 20px;
        border-radius: 10px;
        background: rgba(5, 8, 16, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.25);
        opacity: 0;
        transform: translateY(6px);
        transition: 220ms ease;
      }

      #message.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="hud-row">
          <div class="panel">
            <div class="label">Score</div>
            <div id="score" class="value">0</div>
          </div>
          <div class="panel">
            <div class="label">Distance</div>
            <div id="distance" class="value">0 m</div>
          </div>
          <div class="panel">
            <div class="label">Near Misses</div>
            <div id="nearMisses" class="value">0</div>
          </div>
        </div>

        <div class="hud-row">
          <canvas id="speedometer" class="panel"></canvas>
        </div>

        <div id="message">CRASHED<br />Press <b>R</b> to restart</div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
